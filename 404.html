<!doctype html>
<!-- GitHub Pages automatically serves this file for any unmatched URL -->
<html lang="en">

<head>
  <meta charset="utf-8" />

  <title>404 — Page Not Found · BreachLabs Technologies</title>
  <meta name="description" content="Page not found on BreachLabs Technologies." />

  <!-- Favicons -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="BL_Icon_Primary.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="BL_Icon_Primary.svg" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <!-- Logo links back to homepage -->
      <a class="brand" href="./" aria-label="BreachLabs Technologies — go to homepage">
        <svg class="brand-wordmark" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g transform="translate(24, 14)">
            <polygon points="0,0 58,0 58,30 38,30 8,62 0,62"    fill="#0DCFCF"/>
            <polygon points="46,36 58,36 58,78 0,78 0,66 20,66" fill="#0DCFCF"/>
          </g>
          <text x="114" y="58"
            font-family="'Courier New','Lucida Console',Consolas,monospace"
            font-size="32" font-weight="700" letter-spacing="0.5" fill="#FFFFFF"
          >Breach<tspan fill="#0DCFCF">Labs</tspan></text>
          <text x="116" y="78"
            font-family="'Courier New','Lucida Console',Consolas,monospace"
            font-size="10" font-weight="400" letter-spacing="5" fill="#0DCFCF"
          >TECHNOLOGIES</text>
        </svg>
      </a>

      <!-- Hash links use ./#section to resolve correctly from any path depth -->
      <nav class="nav" aria-label="Main navigation">
        <a href="./#what-we-build">What We Build</a>
        <a href="./#projects">Projects</a>
        <a href="./#approach">Approach</a>
        <a href="./#contact" class="nav-cta">Contact</a>
      </nav>

    </div>
  </header>

  <!-- Primary landmark — screen readers jump directly here -->
  <main class="container error-page">

    <!-- Decorative number — aria-hidden so screen readers skip it, the h1 below communicates the error -->
    <p class="error-code" aria-hidden="true">404</p>

    <h1>Page not found</h1>

    <p class="lead">This page doesn't exist or may have moved. Head back to the homepage.</p>

    <!-- <a> not <button> — this navigates to a URL, not triggers a JS action -->
    <a class="btn btn-primary" href="./">Go home</a>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

      <a href="./" class="footer-logo" aria-label="BreachLabs Technologies">
        <span class="footer-mark" aria-hidden="true">
          <svg viewBox="0 0 58 92" xmlns="http://www.w3.org/2000/svg">
            <polygon points="0,0 58,0 58,30 38,30 8,62 0,62"    fill="#0DCFCF"/>
            <polygon points="46,36 58,36 58,92 0,92 0,66 20,66" fill="#0DCFCF"/>
          </svg>
        </span>
      </a>

      <span>© <span id="year"></span> BreachLabs Technologies</span>
      <span class="muted">breachlabs.tech</span>

    </div>
  </footer>

  <script>
    // Writes the current year so the copyright date never needs manual updating
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
